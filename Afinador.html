  <main class="tuner-container">
    <h1>Afinador de guitarra</h1>
    <p>Permite el micrófono y toca una cuerda para afinar.</p>

    <button id="startButton" class="btn">Iniciar afinador</button>

    <div id="tuner-ui" class="tuner-ui">
      <div id="note-display" class="note-display">
        <h1 id="note">—</h1>
      </div>

      <div class="gauge-wrapper">
        <span id="indicator-low" class="direction-indicator low">Grave</span>
        <div class="gauge-container">
          <div class="gauge-scale">
            <div class="scale-mark center"></div>
            <div class="scale-mark pos-25"></div>
            <div class="scale-mark neg-25"></div>
            <div class="scale-mark pos-50"></div>
            <div class="scale-mark neg-50"></div>
          </div>
          <div id="gauge-needle" class="gauge-needle"></div>
        </div>
        <span id="indicator-high" class="direction-indicator high">Agudo</span>
      </div>

      <div class="info-display">
        <p id="freq">Frecuencia: — Hz</p>
        <p id="deviation">Desviación: —</p>
      </div>
    </div>
  </main>
