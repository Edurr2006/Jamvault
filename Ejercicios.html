<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios | JamVault</title>
    <link rel="stylesheet" href="IndexStyles.css">
    <style>
        /* Estilos específicos para Ejercicios */


        .exercises-container {
            width: 95%;
            /* Explicit width instead of max-width */
            max-width: 1800px;
            /* Cap it only on ultra-wide screens */
            margin: 2rem auto;
            padding: 0 1rem;
            box-sizing: border-box;
        }

        .exercises-header {
            text-align: left;
            margin-bottom: 2rem;
            width: 100%;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            margin-bottom: 3rem;
            width: 100%;
            /* Ensure controls span full width */
        }

        #addExerciseBtn {
            background-color: #FF8906;
            color: #000;
            font-weight: bold;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-bar {
            flex-grow: 1;
            width: 100%;
            text-align: left;
            padding: 18px 25px;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: #fff;
            transition: all 0.3s ease;
            font-weight: normal;
        }

        .search-bar:focus {
            border-color: #FF8906;
            box-shadow: 0 0 20px rgba(255, 137, 6, 0.2);
            outline: none;
        }

        .search-bar::placeholder {
            color: rgba(0, 0, 0, 0.7);
        }

        .exercise-card {
            background-color: #212129;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            /* Ensure card spans full width */
            box-sizing: border-box;
        }

        .exercise-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            background-color: #25252d;
        }

        .JamVault .exercise-card,
        .natural .exercise-card,
        .galactic .exercise-card,
        .retro .exercise-card,
        .vintage .exercise-card,
        .redblack .exercise-card {
            border-left: none;
            /* Removing the colored border-left to match image clean look */
        }

        .exercise-header {
            display: flex;
            flex-direction: column;
            /* Stack title and tags */
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0;
        }

        .exercise-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #cfcfcf;
            /* Lighter grey text */
        }

        .tags {
            display: flex;
            gap: 0.8rem;
        }

        .tag {
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            /* Slightly squarer than pill */
            font-size: 0.85rem;
            font-weight: bold;
            color: #000;
        }

        /* Specific Tag Colors based on content text matches */
        /* Note: This relies on manual classes or inline styles usually, but since we are generating them in JS, we might
    need to tweak JS.
    However, we can try to style broadly or hope standard tag classes work.
    The image shows:
    Orange for Category
    Green/Pink for Level
    */

        /* Overriding theme specific tags for this page to match the mockup's consistency */
        .tag {
            background-color: #ccc;
        }

        /* Default */

        .exercise-footer {
            display: none;
            /* Image doesn't show footer/bpm controls visible immediately on card? Or maybe they are there. Let's
    hide minimal footer items if not needed or keep them subtle. */
        }

        /* Re-enabling modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            cursor: pointer;
            font-size: 2rem;
            /* Increased size */
            color: #ccc;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #fff;
        }

        /* Theme-specific overrides for inputs and selects */
        .JamVault .form-group input,
        .JamVault .form-group select {
            border-color: #FF8906;
        }

        .JamVault .form-group select option {
            background-color: #0f0e17;
            color: #fff;
        }

        .natural .form-group input,
        .natural .form-group select {
            border-color: #40916C;
        }

        .natural .form-group select option {
            background-color: #1a1f1b;
            color: #DDE6D5;
        }

        .galactic .form-group input,
        .galactic .form-group select {
            border-color: #3282B8;
        }

        .galactic .form-group select option {
            background-color: #0C1B33;
            color: #fff;
        }

        .retro .form-group input,
        .retro .form-group select {
            border-color: #FF6F61;
        }

        .retro .form-group select option {
            background-color: #1a1a1a;
            color: #FFD460;
        }

        .vintage .form-group input,
        .vintage .form-group select {
            border-color: #FFB300;
        }

        .vintage .form-group select option {
            background-color: #1F1A16;
            color: #fff;
        }

        .redblack .form-group input,
        .redblack .form-group select {
            border-color: #C74B50;
        }

        .redblack .form-group select option {
            background-color: #121212;
            color: #fff;
        }
    </style>
</head>

<body class="JamVault">
    <header>
        <a href="INDEX.html">
            <div class="logo-title">
                <img src="imagenes/logo.png" alt="Logo" class="Logo">
            </div>
        </a>
        <div class="nav-links">
            <a href="Acordes.html" class="btn">Acordes</a>
            <a href="Escalas.html" class="btn">Escalas</a>
            <a href="Tabs.html" class="btn">Tabs</a>
            <a href="Afinador.html" class="btn">Afinador</a>
            <a href="Jamstudio.html" class="btn">JamStudio</a>
            <a href="Songbook.html" class="btn">Canciones</a>
            <a href="Ejercicios.html" class="btn">Ejercicios</a>
        </div>
        <button id="toggleTheme" class="btn">Cambiar Tema</button>
    </header>

    <main class="exercises-container">
        <div class="exercises-header">
            <h2>Ejercicios</h2>

            <div class="controls-bar">
                <button id="addExerciseBtn" class="btn">+ Añadir</button>
                <input type="text" id="searchInput" class="search-bar"
                    placeholder="Ej. Escala Pentatónica, Spider Exercise, etc...">
            </div>
        </div>

        <div id="exercisesList">
            <!-- Los ejercicios se generarán aquí dinámicamente -->
        </div>
    </main>

    <!-- Modal para nuevo ejercicio -->
    <div id="exerciseModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Nuevo Ejercicio</h3>
            <form id="exerciseForm">
                <div class="form-group">
                    <label>Nombre del Ejercicio</label>
                    <input type="text" id="exName" required>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="exCategory">
                        <option value="Escalas">Escalas</option>
                        <option value="Acordes">Acordes</option>
                        <option value="Técnica">Técnica</option>
                        <option value="Velocidad">Velocidad</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nivel</label>
                    <select id="exLevel">
                        <option value="Principiante">Principiante</option>
                        <option value="Intermedio">Intermedio</option>
                        <option value="Avanzado">Avanzado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>BPM Inicial</label>
                    <input type="number" id="exBpm" value="60" min="40" max="300">
                </div>
                <button type="submit" class="btn" style="width: 100%">Guardar Ejercicio</button>
            </form>
        </div>
    </div>

    <!-- ========== SITE FOOTER ========== -->
    <footer class="site-footer">
        <div class="footer-socials">
            <a href="#" class="social-circle">f</a>
            <a href="#" class="social-circle">t</a>
            <a href="#" class="social-circle">i</a>
            <a href="#" class="social-circle">y</a>
        </div>
        <nav class="footer-nav">
            <a href="index.html">Home</a>
            <a href="#">News</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <div class="footer-copyright">
            Copyright | Designed by JamVault
        </div>
    </footer>

    <script src="LocalStorage.js"></script>
    <script src="Ejercicios.js"></script>
</body>

</html>
