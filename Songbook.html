<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libro de Canciones</title>

  <!-- Enlace al CSS general -->
  <link rel="stylesheet" href="IndexStyles.css" />
  <script src="ThemeInit.js"></script>

  <!-- Script que gestiona el cambio de tema -->
  <script src="LocalStorage.js" defer></script>

  <style>
    .container {
      max-width: 1400px;
      width: 95%;
      margin: 3rem auto;
      padding: 0 2rem;
      text-align: left;
      /* Overriding global center */
    }

    .search-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 100;
    }

    .search-box-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
    }

    #searchInput {
      width: 100%;
      text-align: left;
      padding: 15px 50px 15px 25px;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transition: all 0.3s ease;
      color: #fff;
    }

    #searchInput:focus {
      border-color: #f39c12;
      box-shadow: 0 0 20px rgba(243, 156, 18, 0.2);
      outline: none;
    }

    #clearSearch {
      position: absolute;
      right: 15px;
      background: #f39c12;
      border: none;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Static Search Results Area */
    #search-results-area {
      width: 100%;
      max-width: 1000px;
      margin-top: 15px;
      display: none;
      /* Hidden when empty */
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .search-result-item {
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s;
      width: 140px;
      text-align: center;
    }

    .search-result-item:hover {
      background: rgba(243, 156, 18, 0.1);
    }

    .search-result-item:active {
      cursor: grabbing;
    }

    .result-info {
      display: flex;
      flex-direction: column;
    }

    .result-title {
      font-weight: bold;
      color: #fff;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .result-artist {
      font-size: 0.75rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Songbook Columns */
    .songbook-container {
      display: flex;
      flex-direction: row;
      gap: 1.5rem;
      margin-top: 2rem;
      align-items: stretch;
      justify-content: space-between;
    }

    .songbook-column {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      min-height: 500px;
      flex: 1;
      /* Stretch to fill space horizontally */
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .songbook-column.drag-over {
      background: rgba(243, 156, 18, 0.05);
      border-color: #f39c12;
      transform: scale(1.02);
    }

    .songbook-header {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid rgba(243, 156, 18, 0.5);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .songbook-list {
      flex: 1;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 15px;
      align-content: flex-start;
    }

    .song-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: grab;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 150px;
      /* Reduced width */
      min-height: 80px;
      /* Reduced height */
      text-align: center;
      position: relative;
    }

    .song-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(243, 156, 18, 0.3);
    }

    .song-card:active {
      cursor: grabbing;
    }

    .song-card-info {
      display: flex;
      flex-direction: column;
    }

    .song-card-title {
      font-weight: 600;
      color: #fff;
      font-size: 0.85rem;
      /* Smaller font */
    }

    .song-card-artist {
      font-size: 0.7rem;
      /* Smaller font */
      color: #aaa;
    }

    .btn-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 85, 85, 0.1);
      border: none;
      color: #ff5555;
      cursor: pointer;
      font-size: 0.9rem;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.2s;
    }

    .song-card:hover .btn-delete {
      opacity: 1;
    }

    .btn-delete:hover {
      background: #ff5555;
      color: #fff;
      transform: scale(1.1);
    }

    #loading {
      display: none;
      text-align: center;
      color: #f39c12;
      margin-top: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body> <!-- Esta clase se actualiza dinámicamente con localstorage.js -->

  <!-- ========== HEADER GLOBAL ========== -->
  <header>
    <a href="index.html">
      <div class="logo-title">
        <img src="imagenes/logo.png" alt="Logo" class="Logo" />
      </div>
    </a>

    <div class="nav-links">
      <a href="Acordes.html" class="btn">Acordes</a>
      <a href="Escalas.html" class="btn">Escalas</a>
      <a href="Tabs.html" class="btn">Tabs</a>
      <a href="Afinador.html" class="btn">Afinador</a>
      <a href="Jamstudio.html" class="btn">JamStudio</a>
      <a href="Songbook.html" class="btn">Canciones</a>
      <a href="Ejercicios.html" class="btn">Ejercicios</a>
    </div>

    <button id="toggleTheme" class="btn">Cambiar Tema</button>
  </header>

  <!-- ========== CONTENIDO PRINCIPAL ========== -->
  <main class="container">
    <h1>Libro de Canciones</h1>

    <div class="search-area">
      <div class="search-box-wrapper">
        <input type="text" id="searchInput" placeholder="Busca canciones para agregar..." autocomplete="off">
        <button id="clearSearch" title="Limpiar búsqueda">✕</button>
      </div>
      <div id="loading">🤘 Buscando canciones...</div>
      <div id="search-results-area"></div>
    </div>

    <section class="songbook-container">
      <div class="songbook-column" data-category="want">
        <h2 class="songbook-header">Quiero Aprenderlas <span class="count">0</span></h2>
        <div class="songbook-list" id="want-list"></div>
      </div>

      <div class="songbook-column" data-category="progress">
        <h2 class="songbook-header">En Proceso <span class="count">0</span></h2>
        <div class="songbook-list" id="progress-list"></div>
      </div>

      <div class="songbook-column" data-category="done">
        <h2 class="songbook-header">Aprendidas <span class="count">0</span></h2>
        <div class="songbook-list" id="done-list"></div>
      </div>
    </section>
  </main>

  <!-- ========== SITE FOOTER ========== -->
  <footer class="site-footer">
    <div class="footer-socials">
      <a href="#" class="social-circle">f</a>
      <a href="#" class="social-circle">t</a>
      <a href="#" class="social-circle">i</a>
      <a href="#" class="social-circle">y</a>
    </div>
    <nav class="footer-nav">
      <a href="index.html">Home</a>
      <a href="#">News</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
    <div class="footer-copyright">
      Copyright | Designed by JamVault
    </div>
  </footer>

  <script src="Toast.js"></script>
  <script src="Songbook.js"></script>
  <script src="ResponsiveMenu.js"></script>
</body>

</html>
