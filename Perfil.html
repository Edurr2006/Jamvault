<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JamVault - Mi Perfil</title>
  <link rel="stylesheet" href="css/IndexStyles.css?v=2">
  <link rel="icon" type="image/png" href="imagenes/favicon.png">
  <script src="js/utils/ThemeInit.js"></script>
  <style>
    .profile-container {
      max-width: 600px;
      margin: 100px auto 50px;
      padding: 2.5rem;
      background: rgba(15, 14, 20, 0.85);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .profile-container h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 2rem;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .profile-form-group {
      margin-bottom: 2rem;
    }

    .profile-label {
      display: block;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-left: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">
        <div class="logo-title">
            <img src="imagenes/logo.png" alt="Logo" class="Logo">
        </div>
    </a>
    <div class="nav-links">
        <a href="Acordes.html" class="btn">Acordes</a>
        <a href="Escalas.html" class="btn">Escalas</a>
        <a href="Tabs.html" class="btn">Tabs</a>
        <a href="Afinador.html" class="btn">Afinador</a>
        <a href="Jamstudio.html" class="btn">JamStudio</a>
        <a href="Songbook.html" class="btn">Canciones</a>
        <a href="Ejercicios.html" class="btn">Ejercicios</a>
    </div>
    <button id="toggleTheme" class="btn">Cambiar Tema</button>
  </header>

  <div class="container" style="min-height: 75vh; display: flex; align-items: center; justify-content: center;">
    <div class="profile-container">
      <h2>Mis Datos</h2>
      <form id="perfilForm">
        <div class="profile-form-group">
            <label class="profile-label">Nombre de usuario</label>
            <div class="auth-input-group" style="margin-bottom:0;">
                <input type="text" id="perfilUsername" class="auth-input" placeholder="Nombre de usuario" required>
                <i class="fas fa-user" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); pointer-events: none;"></i>
            </div>
        </div>
        <div class="profile-form-group">
            <label class="profile-label">Correo electrónico</label>
            <div class="auth-input-group" style="margin-bottom:0;">
                <input type="email" id="perfilEmail" class="auth-input" placeholder="Correo electrónico" required>
                <i class="fas fa-envelope" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); pointer-events: none;"></i>
            </div>
        </div>
        <div class="profile-form-group" style="margin-top: 3rem;">
            <label class="profile-label">Nueva contraseña</label>
            <div class="auth-input-group" style="margin-bottom:0;">
                <input type="password" id="perfilPassword" class="auth-input" placeholder="Déjalo en blanco para no cambiarla" autocomplete="new-password">
                <i class="fas fa-lock" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); pointer-events: none;"></i>
            </div>
            <small style="color: rgba(255,255,255,0.4); margin-left:14px; margin-top: 8px; display: block; font-size:0.8rem;">Solo rellena este campo si deseas modificar tu contraseña actual.</small>
        </div>
        
        <div id="perfilResponseMsg" style="margin-bottom: 2rem; font-size: 0.95rem; text-align: center; display: none; padding: 12px; border-radius: 12px;"></div>
        
        <button type="submit" class="auth-submit-btn" style="margin-top: 0.5rem;">GUARDAR CAMBIOS</button>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-socials">
        <a href="#" class="social-circle">f</a>
        <a href="#" class="social-circle">t</a>
        <a href="#" class="social-circle">i</a>
        <a href="#" class="social-circle">y</a>
    </div>
    <nav class="footer-nav">
        <a href="index.html">Home</a>
        <a href="#">News</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="footer-copyright">
        Copyright | Designed by JamVault
    </div>
  </footer>

  <script src="js/utils/LocalStorage.js"></script>
  <script src="js/utils/Toast.js"></script>
  <script src="js/utils/ResponsiveMenu.js"></script>
  <script src="js/auth/Auth.js?v=10"></script>
  <script src="js/ui/Perfil.js"></script>
</body>

</html>
